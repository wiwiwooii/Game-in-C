name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.161.1"
          extended: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: hugo --source site --baseURL "https://wiwiwooii.github.io/Game-in-C/"

      - name: Fix all absolute paths for GitHub Pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          base = "Game-in-C"
          root = Path("site/public")
          exts = {".html", ".xml", ".css", ".js"}

          for path in root.rglob("*"):
              if path.suffix.lower() not in exts:
                  continue

              text = path.read_text(encoding="utf-8", errors="ignore")

              text = re.sub(
                  r'(\b(?:href|src)=["\'])/(?!Game-in-C/|/)',
                  rf'\1/{base}/',
                  text
              )

              text = re.sub(
                  r'(\b(?:href|src)=)/(?!Game-in-C/|/)',
                  rf'\1/{base}/',
                  text
              )

              text = re.sub(
                  r'url\(/(?!Game-in-C/|/)',
                  rf'url(/{base}/',
                  text
              )

              text = text.replace(
                  "https://wiwiwooii.github.io/",
                  "https://wiwiwooii.github.io/Game-in-C/"
              )

              text = text.replace(
                  "https://wiwiwooii.github.io/Game-in-C/Game-in-C/",
                  "https://wiwiwooii.github.io/Game-in-C/"
              )

              text = text.replace(
                  "/Game-in-C/Game-in-C/",
                  "/Game-in-C/"
              )

              path.write_text(text, encoding="utf-8")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
