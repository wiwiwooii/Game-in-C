name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.161.1"
          extended: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site with drafts
        run: hugo --source site --baseURL "https://wiwiwooii.github.io/Game-in-C/" --buildDrafts

      - name: Fix GitHub Pages asset paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("site/public")
          prefix = "/Game-in-C/"

          for path in root.rglob("*"):
              if path.suffix.lower() not in [".html", ".css", ".js", ".xml"]:
                  continue

              text = path.read_text(encoding="utf-8", errors="ignore")

              text = re.sub(
                  r'(\b(?:href|src)=["\'])/(?!Game-in-C/|/)',
                  r'\1' + prefix,
                  text
              )

              text = re.sub(
                  r'(\b(?:href|src)=)/(?!Game-in-C/|/)',
                  r'\1' + prefix,
                  text
              )

              text = re.sub(
                  r'url\(/(?!Game-in-C/|/)',
                  'url(' + prefix,
                  text
              )

              text = text.replace("/Game-in-C/Game-in-C/", "/Game-in-C/")

              path.write_text(text, encoding="utf-8")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
